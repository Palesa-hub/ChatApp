name: Java CI with Maven

on:
  push:
    branches: [ "main", "Part2" ]
  pull_request:
    branches: [ "main", "Part2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean install
    
    - name: Run Tests
      run: mvn test